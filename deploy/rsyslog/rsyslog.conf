# Centralized Log Monitoring Dashboard - remote Windows Agent collector
#
# Install as:
#   /etc/rsyslog.d/10-centralized-monitoring.conf
#
# Default listener uses non-privileged port 5514. Keep this port limited to
# the ZeroTier private network with the VPS firewall.

module(load="imudp")
module(load="imtcp")

input(type="imudp" port="5514" ruleset="centralizedMonitoringRemote")
input(type="imtcp" port="5514" ruleset="centralizedMonitoringRemote")

template(
    name="CentralizedRemoteHostFile"
    type="string"
    string="/var/log/remote/%HOSTNAME%.log"
)

template(
    name="CentralizedRemoteLogFormat"
    type="string"
    string="%timereported:::date-rfc3339% %HOSTNAME% %syslogtag%%msg%\n"
)

ruleset(name="centralizedMonitoringRemote") {
    action(
        type="omfile"
        dynaFile="CentralizedRemoteHostFile"
        template="CentralizedRemoteLogFormat"
        createDirs="on"
    )

    action(
        type="omfile"
        file="/var/log/remote/all.log"
        template="CentralizedRemoteLogFormat"
        createDirs="on"
    )

    stop
}
